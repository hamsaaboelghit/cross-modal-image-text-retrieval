name: Backend CI

on:
  pull_request:
    paths:
      - "app/backend/**"
      - "src/models/**"
      - "src/retrieval/**"
      - "src/data/vocabulary.py"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/backend/**"
      - "src/models/**"
      - "src/retrieval/**"
      - "src/data/vocabulary.py"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend API and retrieval tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "tensorflow-cpu==2.16.2" "fastapi>=0.110,<1.0" "uvicorn[standard]>=0.27,<1.0" "python-multipart>=0.0.9" "httpx>=0.27,<1.0" "Pillow>=10,<12" "pytest>=8,<9"

      - name: Run backend tests
        run: python -m pytest app/backend/test_main.py app/backend/test_retrieval_service.py -v
